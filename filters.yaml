  - marketing
  - brand management
  - brand manager
  - brand marketing
  - product marketing
  - digital marketing
  - growth marketing
  - social media marketing
  - advertising
  # Sales
  - sales
  - account executive
  - account manager
  - account management
  - sales development
  - business development representative
  # Consulting
  - consulting
  - consultant
  - consultants
  - management consulting
  - strategy consulting
  - associate consultant
  # Business development
  - business development
  - partnerships
  - corporate development

# Top priority unless an off-target word also appears.
focus:
