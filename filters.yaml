# What counts as a match. All phrases are case-insensitive whole words/phrases.

# Wording in phone alerts and dashboard headings.
alert_label: marketing/sales/consulting
dashboard:
  title: Business internship tracker (marketing / sales / consulting / BD)
  high: "🎯 Marketing / sales / consulting / BD internships — open now"
  medium: "Related internships (comms, PR, media, client roles) — open now"
  low: "Lower priority (tech, finance, ops, events) — open now"

# Your graduation year (you're a sophomore now, class of 2029). The tracker then shows:
#   - every summer 2028 internship (after your junior year)
#   - summer 2027 internships (after sophomore year) ONLY if the posting says sophomores /
#     the class of 2029 can apply. It reads each posting's description to check.
#   - undated internships, unless they're limited to other class years
# Postings for any other summer are ignored.
graduation_year: 2029

# Only postings in these places are kept. Vague locations ("2 Locations", "United States",
# "Remote") are kept only if the posting's description mentions one of them.
only_locations:
  - new york
  - new york city
  - nyc
  - manhattan
  - brooklyn
  - boston
  - cambridge, ma
  - cambridge, massachusetts
only_locations_label: [NYC, Boston]

# Search terms sent to each careers site. Your two summer years (2027, 2028) are added automatically.
search_terms: [internship, summer]

# A posting must contain one of these to count as an internship at all.
# ("intern" is matched as a whole word, so "Internal Audit" doesn't count.)
early_career:
  - intern
  - interns
  - internship
  - internships
  - summer analyst
  - summer analysts
  - summer program
  - summer programme
  - summer internship
  - co-op
  - early insight
  - early insights
  - insight program
  - sophomore
  - freshman
  - first-year

# Never shown: wrong level for an undergrad.
exclude:
  - mba
  - pre-mba
  - summer associate
  - summer associates
  - phd
  - ph.d
  - doctoral
  - postdoc
  - masters
  - master's
  - full-time
  - full time
  - vice president
  - director
  - experienced
  - jd
  - law student
  - apprenticeship

# Shown on the dashboard only (no push): recruiting events rather than applications.
events:
  - info session
  - information session
  - coffee chat
  - coffee chats
  - open house
  - roadshow
  - webinar
  - networking
  - event
  - office hours
  - meet the

