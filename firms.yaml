# Every company the tracker checks. Endpoints were verified on 2026-11-05.
#
# kind: focus = any internship there that isn't tech/finance/ops etc. is an instant push
#               (consulting firms and ad agencies, where most internships are client-facing).
# kind: other = only marketing / sales / consulting / BD internships are pushed.
#
# To add a company, click "Apply" on any of its jobs and look at the URL:
#   <tenant>.wd<N>.myworkdayjobs.com/<site>/...      -> type: workday
#   boards.greenhouse.io/<board>/...                  -> type: greenhouse
#   jobs.lever.co/<company>/...                       -> type: lever
#   jobs.ashbyhq.com/<board>/...                      -> type: ashby
#   jobs.smartrecruiters.com/<company>/...            -> type: smartrecruiters
#   <host>/hcmUI/CandidateExperience/en/sites/<site>  -> type: oracle
#   <host>.tal.net/...                                -> type: oleeo (paste the job board URL)
#   careers-<name>.icims.com/...                      -> type: icims, base: https://careers-<name>.icims.com
#   anything else                                     -> type: page (watches the page for new internship text)

